<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطولات البطاقات</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111827;--line:#2b3850;--text:#f7f9fc;--muted:#9aa7bb;--gold:#f5c451;--red:#ef5b67;--green:#5ed49a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#263653,#0d1422 38%,var(--bg) 75%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px}.wrap{width:min(760px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:24px;font-weight:900}.sub{color:var(--muted);font-size:12px}.badge{border:1px solid var(--line);background:#0e1523;border-radius:999px;padding:7px 11px;color:var(--gold);font-weight:800}.arena{margin-top:12px;border:1px solid var(--line);background:linear-gradient(180deg,#151f31,#0d1420);border-radius:24px;padding:14px;box-shadow:0 20px 60px #0008}.fighters{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center}.fighter{text-align:center}.avatar{width:78px;height:78px;border-radius:22px;margin:auto;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,#293750,#101722);border:1px solid #40506b}.enemy .avatar{background:linear-gradient(145deg,#512a35,#171017)}.name{font-weight:900;margin-top:7px}.bar{height:9px;background:#252d3a;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;transition:width .2s}.php{background:var(--green)}.ehp{background:var(--red)}.vs{text-align:center;font-weight:1000;color:var(--gold);font-size:20px}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{background:#0c1320;border:1px solid var(--line);padding:6px 10px;border-radius:10px;font-size:12px}.status{text-align:center;min-height:42px;padding:10px;border-radius:14px;background:#0b111c;border:1px solid var(--line);color:#dce5f5;font-weight:700}.hand-title{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{min-height:142px;border:1px solid #35435c;background:linear-gradient(155deg,#1a263a,#101722);border-radius:16px;padding:11px;text-align:right;color:var(--text);cursor:pointer;box-shadow:0 8px 20px #0003}.card:disabled{opacity:.42;cursor:not-allowed}.card:not(:disabled):active{transform:scale(.98)}.icon{font-size:27px}.cardname{font-weight:900;margin-top:5px}.cost{color:var(--gold);font-size:12px;font-weight:900;margin-top:4px}.desc{color:var(--muted);font-size:11px;margin-top:6px}.footer{display:flex;justify-content:center;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}.win{color:var(--gold)}@media(max-width:520px){.title{font-size:20px}.cards{grid-template-columns:repeat(2,1fr)}.card{min-height:132px}.fighters{grid-template-columns:1fr 48px 1fr}.avatar{width:66px;height:66px;font-size:31px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="title">⚔️ بطولات البطاقات</div><div class="sub">معركة تكتيكية — أفضل من 3 جولات</div></div><div id="round" class="badge">الجولة 1</div></div><section class="arena"><div class="fighters"><div class="fighter"><div class="avatar">🧑‍🎤</div><div class="name">أنت</div><div class="bar"><div id="php" class="fill php"></div></div><div id="pht" class="sub">50 / 50</div></div><div class="vs">VS</div><div class="fighter enemy"><div class="avatar">👹</div><div class="name">الخصم</div><div class="bar"><div id="ehp" class="fill ehp"></div></div><div id="eht" class="sub">50 / 50</div></div></div><div class="stats"><div id="energy" class="stat">🔋 طاقة 5/5</div><div id="shield" class="stat">🛡️ درع 0</div><div id="wins" class="stat">🏆 0 - 0</div></div><div id="status" class="status">اختر بطاقة وابدأ</div><div class="hand-title"><span>بطاقاتك</span><span class="sub">اختر حركة</span></div><div id="cards" class="cards"></div></section><div class="footer"><span>نسخة مستقلة • جاهزة لـ GitHub وVercel</span></div></main>
<script>
const C={butterfly:{n:"الفراشة",c:1,d:4,i:"🦋",t:"هجوم سريع"},strike:{n:"الضربة الثقيلة",c:2,d:9,i:"💥",t:"ضرر قوي"},shield:{n:"الدرع",c:1,a:7,i:"🛡️",t:"يصد الهجوم التالي"},focus:{n:"تركيز",c:1,b:3,i:"🎯",t:"يزيد قوة الهجوم التالي"},drain:{n:"الاستنزاف",c:2,d:6,h:4,i:"🩸",t:"ضرر + استعادة صحة"},counter:{n:"الرد القاتل",c:2,d:7,i:"⚡",t:"هجوم قوي"}},D=Object.keys(C),MAX=50,E=5;
let s={r:1,w:[0,0],ph:50,eh:50,en:E,sh:0,fo:0,hand:[...D],over:false,last:"اختر بطاقة لبدء الهجوم"};
function draw(){round.textContent="الجولة "+s.r;php.style.width=s.ph*2+"%";ehp.style.width=s.eh*2+"%";pht.textContent=s.ph+" / 50";eht.textContent=s.eh+" / 50";energy.textContent="🔋 طاقة "+s.en+"/5";shield.textContent="🛡️ درع "+s.sh;wins.textContent="🏆 "+s.w[0]+" - "+s.w[1];status.textContent=s.last;cards.innerHTML="";
if(s.over){status.textContent=s.w[0]>s.w[1]?"🎉 فزت بالمباراة!":"انتهت المباراة";return}
for(const id of s.hand){let c=C[id],b=document.createElement("button");b.className="card";b.disabled=s.en<c.c;b.innerHTML='<div class="icon">'+c.i+'</div><div class="cardname">'+c.n+'</div><div class="cost">🔋 '+c.c+'</div><div class="desc">'+c.t+'</div>';b.onclick=()=>play(id);cards.append(b)}}
function resetRound(w){s.w[w]++;if(s.w[w]>=2){s.over=true;s.last=w===0?"فزت بالمباراة!":"الخصم فاز بالمباراة";return}Object.assign(s,{r:s.r+1,ph:50,eh:50,en:5,sh:0,fo:0,hand:[...D],last:"الجولة التالية جاهزة"})}
function enemy(){let a=D.filter(id=>C[id].c<=s.en);let id=a[Math.floor(Math.random()*a.length)];if(!id){s.en=Math.min(5,s.en+1);return}let c=C[id];s.en-=c.c;if(id==="shield"){s.last="الخصم استخدم الدرع";s.en=Math.min(5,s.en+1);return}let d=(c.d||0)+Math.floor(Math.random()*3);d=Math.max(0,d-s.sh);s.sh=Math.max(0,s.sh-(c.d||0));s.ph=Math.max(0,s.ph-d);s.last="الخصم استخدم "+c.n+": -"+d+" صحة";s.en=Math.min(5,s.en+1)}
function play(id){if(s.over)return;let c=C[id];if(s.en<c.c)return;s.en-=c.c;s.hand=s.hand.filter(x=>x!==id);
if(id==="shield"){s.sh=Math.min(12,s.sh+c.a);s.last="الدرع: +"+c.a}else if(id==="focus"){s.fo=Math.min(8,s.fo+c.b);s.last="تركيز: +"+c.b+" هجوم"}else{let d=(c.d||0)+s.fo;s.fo=0;d=Math.max(0,d-s.eh*0);s.eh=Math.max(0,s.eh-d);if(id==="drain")s.ph=Math.min(50,s.ph+c.h);s.last=c.n+": -"+d+" صحة"}
if(!s.hand.length)s.hand=[...D];if(s.eh<=0){resetRound(0);draw();return}enemy();if(s.ph<=0)resetRound(1);draw()}
draw();
</script></body></html>
